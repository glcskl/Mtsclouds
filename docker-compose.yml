version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=file:./dev.db
      - SESSION_SECRET=mts-cloud-hackathon-secret
      - PORT=3001
      - PROVIDER=${PROVIDER:-mock}
    volumes:
      # Mount docker socket for DockerProvider mode (optional)
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
